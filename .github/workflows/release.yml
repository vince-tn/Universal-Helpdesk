name: Test and release

on:
  push:
    branches: [main, staging]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, mysqli, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check every PHP file parses
        run: find app tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Unit tests
        run: vendor/bin/phpunit --no-coverage tests/unit

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark this commit as ready for the box
        run: git push --force origin "HEAD:refs/heads/release/${{ github.ref_name }}"

services:
  app:
    restart: always
    ports: !override
      - "80:8080"
    environment:
      - CI_ENVIRONMENT=production

      - app_baseURL=${APP_URL:?set APP_URL to this machine's address, e.g. http://helpdesk.local/}

      - ALLOWED_EMAIL_DOMAINS=${ALLOWED_EMAIL_DOMAINS:?set ALLOWED_EMAIL_DOMAINS - an empty allowlist lets anyone sign up}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - MAIL_HOST=${MAIL_HOST:?set MAIL_HOST - signup codes have to actually arrive}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USER=${MAIL_USER:-}
      - MAIL_PASS=${MAIL_PASS:-}
      - MAIL_CRYPTO=${MAIL_CRYPTO:-tls}
      - MAIL_FROM=${MAIL_FROM:?set MAIL_FROM - relays reject unknown senders}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Chikiting System}

  db:
    restart: always
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD - do not ship the default}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}

    ports: !override
      - "127.0.0.1:3307:3306"

  n8n:
    restart: always
    environment:
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=http://localhost:5678/

    ports: !override
      - "127.0.0.1:5678:5678"

  ollama:
    restart: always

    environment:
      - OLLAMA_KEEP_ALIVE=-1

    ports: !override
      - "127.0.0.1:11434:11434"

  ollama-init:
    restart: always
    environment:
      - OLLAMA_INIT_STAY=yes

  mailpit:
    restart: always

    ports: !override
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  nocodb:
    profiles: ["disabled"]
